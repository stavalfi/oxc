# Publishes @stavalfi/oxc to npm through trusted publishing (OIDC) — no token,
# no 2FA. npm trusts this exact repo + workflow file name, configured on
# npmjs.com -> @stavalfi/oxc -> Settings -> Trusted Publisher.
name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

# A newer push supersedes an unfinished publish: cancel it and publish the new commit.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    # A manual run can target any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    # The package ships only the napi addon of the machine that built it, and
    # poc runs oxlint on darwin-arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # publish.sh derives the version from the latest `oxlint_v*` tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: ./publish.sh
